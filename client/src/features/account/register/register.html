<div
  class="flex items-start justify-center px-4 pb-16 pt-24"
>
  <div class="card w-full max-w-130 bg-base-100 shadow-xl rounded-2xl overflow-visible">
    <div class="card-body p-8 sm:p-10">
      <h2 class="mb-1 text-3xl font-bold text-center text-indigo-700">
        Sign up
      </h2>
      <p class="mb-8 text-center text-gray-500">
        Create your account to get started
      </p>

      <form (ngSubmit)="register()" class="flex flex-col gap-4">
        <label class="form-control w-full">
          <div class="label py-1">
            <span class="label-text font-medium text-gray-700">Display name</span>
          </div>
          <input
            type="text"
            name="username"
            [(ngModel)]="creds.username"
            placeholder="e.g. John Doe"
            class="input input-bordered w-full focus:border-indigo-600 focus:outline-indigo-600"
          />
        </label>

        <label class="form-control w-full">
          <div class="label py-1">
            <span class="label-text font-medium text-gray-700">Email</span>
          </div>
          <input
            type="email"
            name="email"
            [(ngModel)]="creds.email"
            placeholder="you@example.com"
            class="input input-bordered w-full focus:border-indigo-600 focus:outline-indigo-600"
          />
        </label>

        <label class="form-control w-full">
          <div class="label py-1">
            <span class="label-text font-medium text-gray-700">Password</span>
          </div>
          <input
            type="password"
            name="password"
            [(ngModel)]="creds.password"
            placeholder="At least 6 characters"
            class="input input-bordered w-full focus:border-indigo-600 focus:outline-indigo-600"
          />
        </label>
        

        <div class="mt-6 flex justify-end gap-3">
          <button
            type="button"
            (click)="cancel()"
            class="btn border-none bg-gray-100 px-6 font-semibold text-gray-800 hover:bg-gray-200"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn border-none bg-indigo-700 px-6 font-semibold text-white hover:bg-indigo-800"
          >
            Register
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
