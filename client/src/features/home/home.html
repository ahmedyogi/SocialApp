<div class="w-full ">
  <div class="h-1.5 w-full bg-linear-to-r from-indigo-600 via-indigo-500 to-black">
    @if (!RegisterMode()) {
      <div class="flex flex-col items-center justify-center text-center px-4 py-24">
        <div class="mb-6">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="w-20 h-20 text-indigo-700"
          >
            <path
              d="M12 12.75c1.63 0 3.07.39 4.24.9 1.08.48 1.76 1.56 1.76 2.73V18a.75.75 0 0 1-.75.75H6.75A.75.75 0 0 1 6 18v-1.62c0-1.17.68-2.25 1.76-2.73 1.17-.51 2.61-.9 4.24-.9Z"
            />
            <path
              fill-rule="evenodd"
              d="M12 3.75a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm0 4.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"
              clip-rule="evenodd"
            />
            <path
              d="M18.75 12.75c1.02 0 1.98.24 2.83.6.7.3 1.17 1 1.17 1.77v.63a.75.75 0 0 1-.75.75h-3v-1.13c0-.98-.32-1.9-.9-2.65.22-.03.44-.05.65-.07Z"
            />
            <path d="M18 10.5a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5Z" />
          </svg>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-3">Find your match</h1>

        <p class="text-gray-600 mb-6">Come on in&hellip; all you need to do is sign up</p>

        <div class="flex items-center gap-3">
          <button
            (click)="showRegister(true)"
            class="btn border-none bg-indigo-700 px-6 text-white shadow-md shadow-indigo-700/20 transition hover:scale-105 hover:bg-indigo-800"
          >
            Register
          </button>
          <button
            class="btn border-none bg-sky-400 px-6 text-gray-900 shadow-md shadow-sky-400/20 transition hover:scale-105 hover:bg-sky-500"
          >
            Learn more
          </button>
        </div>
      </div>
    } @else {
      <app-register (cancelRegister)="showRegister($event)" />
    }
  </div>
</div>
